DB_PATH=C:/ims_files/rbp.db
DB_DRIVER=jdbc:sqlite:

# Mercado Pago (Pix) - ambiente de TESTE. Deixe MP_ACCESS_TOKEN vazio para
# desativar a opcao "Pix" na tela de venda sem quebrar o app. Nunca coloque
# aqui um access token de PRODUCAO real - use um token de teste (sandbox)
# do painel de desenvolvedores do Mercado Pago.
MP_ACCESS_TOKEN=
MP_PAYER_EMAIL_PADRAO=teste@lektec.tech

# Endereco da loja online (site/SaaS que roda em Docker, lendo o mesmo
# rbp.db). Usado pelo botao "Loja Online" da tela inicial. Nao existe
# tela de Configuracoes neste repo de teste para editar isso pela
# interface (essa tela so existe no repositorio de producao ainda) —
# edite esta linha manualmente para testar o botao.
SAAS_ADMIN_URL=
